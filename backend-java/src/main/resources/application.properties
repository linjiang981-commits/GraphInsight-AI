server.port=${SERVER_PORT:8080}
spring.application.name=graphinsight-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/graphinsight}
spring.datasource.username=${DB_USER:graphinsight}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=graphinsight-local
app.jwt.audience=graphinsight-api
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:1800}
app.demo.username=${APP_DEMO_USERNAME:student}
app.demo.password=${APP_DEMO_PASSWORD:}